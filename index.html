<style>
:root{--bg:#000;--ink:#f4f4f5;--mut:#8d8d94;--line:rgba(255,255,255,.12);--ease:cubic-bezier(.2,.8,.2,1);
--font:"Onest",system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans","Microsoft YaHei","Yu Gothic","Malgun Gothic",sans-serif}
*{box-sizing:border-box;margin:0}
html{overflow-x:hidden;background:var(--bg);scroll-behavior:smooth;scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
body{font:400 17px/1.6 var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:10px}
::selection{background:#fff;color:#000}
.wrap{width:min(1040px,calc(100% - 40px - env(safe-area-inset-left) - env(safe-area-inset-right)));margin-inline:auto}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 0 0}
.brand{display:flex;align-items:center;gap:12px;font:600 24px/1 var(--font);letter-spacing:-.02em}
.brand img{width:40px;height:40px;border-radius:12px;display:block}
.lang{position:relative}
.lg{display:flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;background:none;border:0;border-radius:50%;overflow:hidden;cursor:pointer;transition:transform .2s var(--ease),opacity .2s var(--ease)}
.lg:hover{background:rgba(255,255,255,.05)}
.lg:active{transform:scale(.9)}
.lg .fl{display:block!important;flex:0 0 28px;width:28px;height:20px;min-width:28px;min-height:20px;border-radius:4px;overflow:hidden;opacity:1;visibility:visible}
.lg .fl svg{display:block!important;width:28px!important;height:20px!important;min-width:28px;min-height:20px;opacity:1;visibility:visible}

.lg.switching .fl{animation:langFlagSwitch .38s cubic-bezier(.4,0,.2,1) both}
@keyframes langFlagSwitch{0%{opacity:1;transform:translateY(0) scale(1) rotate(0deg)}40%{opacity:0;transform:translateY(-10px) scale(.82) rotate(-8deg)}60%{opacity:0;transform:translateY(10px) scale(.82) rotate(8deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0deg)}}
@media(prefers-reduced-motion:reduce){.lg.switching .fl{animation:none!important}}

/* hero */
.hero{text-align:center;padding:28px 0 96px}
.orbit{--r:clamp(96px,27vw,132px);--s:36px;position:relative;width:calc(var(--r)*2 + var(--s));height:calc(var(--r)*2 + var(--s));margin:20px auto 40px}
.orbit .core{position:absolute;left:50%;top:50%;width:118px;height:118px;margin:-59px 0 0 -59px;border-radius:0;object-fit:contain;animation:coreIn 1.1s var(--ease) both,coreFloat 5.5s ease-in-out 1.1s infinite;filter:drop-shadow(0 0 18px rgba(255,255,255,.12))}
.orbit .o{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);color:#8d8d94;transform:rotate(var(--a)) translateY(calc(var(--r)*-1)) rotate(calc(var(--a)*-1));transition:color .35s var(--ease),transform .45s var(--ease),filter .35s;animation:iconIn .85s var(--ease) both;animation-delay:calc(var(--n)*90ms + 280ms);will-change:transform,opacity}
.orbit .o:hover{color:var(--b);filter:drop-shadow(0 0 8px var(--b));transform:rotate(var(--a)) translateY(calc(var(--r)*-1 - 6px)) rotate(calc(var(--a)*-1)) scale(1.18)}
.orbit svg{display:block;width:100%;height:100%}
@keyframes coreIn{from{opacity:0;transform:scale(.6) rotate(-12deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes coreFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-7px) rotate(3deg)}}
@keyframes iconIn{from{opacity:0;transform:rotate(var(--a)) translateY(calc(var(--r)*-1 + 28px)) rotate(calc(var(--a)*-1)) scale(.4)}to{opacity:1;transform:rotate(var(--a)) translateY(calc(var(--r)*-1)) rotate(calc(var(--a)*-1)) scale(1)}}
h1{font:600 clamp(40px,9vw,84px)/1.04 var(--font);letter-spacing:-.035em;max-width:13ch;margin:0 auto;text-wrap:balance}
.lead{color:var(--mut);font-size:clamp(17px,2.6vw,21px);line-height:1.55;max-width:40ch;margin:26px auto 0;text-wrap:balance}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:36px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:54px;padding:0 28px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;font:500 16px/1 var(--font);transition:background .25s,border-color .25s}
.btn svg{width:20px;height:20px;flex:none}
.btn:hover{border-color:rgba(255,255,255,.6)}
.btn.main{background:#fff;color:#000;border-color:#fff}
.btn.main:hover{background:#e4e4e6;border-color:#e4e4e6}
.note{margin-top:20px;font-size:14px;color:var(--mut)}
.alt{display:inline-block;margin-top:16px;font-size:15px;color:var(--mut);border-bottom:1px solid var(--line)}
.alt:hover{color:#fff}

/* sections */
section{padding:72px 0}
h2{font:600 clamp(28px,5vw,46px)/1.12 var(--font);letter-spacing:-.025em;text-align:center;text-wrap:balance}

/* app preview */
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:32px 0 24px}
.tabs button{padding:10px 20px;border-radius:999px;background:#000;border:1px solid transparent;color:var(--mut);font-size:15px;font-weight:500;transition:color .3s,border-color .3s,background .3s}
.tabs button:hover{color:#fff}
.tabs button[aria-selected=true]{color:#fff;border-color:rgba(255,255,255,.55)}
.stage{position:relative;max-width:1200px;height:min(580px,70vw);margin:32px auto 0;perspective:1200px}
.stage .slide{position:absolute;top:50%;left:50%;width:min(900px,82%);aspect-ratio:4/3;margin:0;border-radius:14px;overflow:hidden;background:#0a0a0a;border:1px solid rgba(255,255,255,.08);box-shadow:0 24px 80px rgba(0,0,0,.55);transform:translate(-50%,-50%) scale(.84);opacity:0;filter:blur(6px) brightness(.45);transition:transform .65s cubic-bezier(.4,0,.2,1),opacity .65s cubic-bezier(.4,0,.2,1),filter .65s cubic-bezier(.4,0,.2,1);pointer-events:none;z-index:0}
.stage .slide{cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.stage .slide.prev,.stage .slide.next{pointer-events:auto}
.stage .slide img.echo{position:absolute;left:0;top:0;opacity:0;background:transparent;pointer-events:none;mix-blend-mode:screen;will-change:transform,opacity}
.stage .slide.fresh img.echo{animation:echo 1s cubic-bezier(.25,.6,.3,1) both}
@keyframes echo{0%{opacity:.55;transform:translateX(var(--gx,8%)) scale(1.05);filter:blur(7px)}100%{opacity:0;transform:translateX(0) scale(1);filter:blur(0)}}
@media(prefers-reduced-motion:reduce){.stage .slide img.echo{display:none}}
.stage .slide img{display:block;width:100%;height:100%;object-fit:contain;object-position:center center;background:#0a0a0a}
.stage .slide.on{transform:translate(-50%,-50%) scale(1);opacity:1;filter:none;z-index:3;pointer-events:auto;box-shadow:0 32px 100px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06)}
.stage .slide.prev{transform:translate(calc(-50% - 42%),-50%) scale(.84);opacity:.55;filter:blur(4px) brightness(.5);z-index:1}
.stage .slide.next{transform:translate(calc(-50% + 42%),-50%) scale(.84);opacity:.55;filter:blur(4px) brightness(.5);z-index:1}
@media(max-width:720px){
  .stage{height:min(280px,78vw)}
  .stage .slide.prev,.stage .slide.next{opacity:0}
}
.cap{max-width:52ch;margin:18px auto 0;text-align:center;color:var(--mut);min-height:2.8em;font-size:15px}
.dots{display:flex;justify-content:center;gap:9px;margin-top:22px}
.dots .dot{width:7px;height:7px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.2);cursor:pointer;transition:background .3s,transform .3s,width .3s}
.dots .dot:hover{background:rgba(255,255,255,.4)}
.dots .dot.on{background:#fff;width:22px;border-radius:99px;transform:none}


/* features */
.feats{display:grid;grid-template-columns:repeat(2,1fr);gap:0 64px;margin-top:48px}
.feats div{padding:28px 0 32px;border-top:1px solid var(--line)}
.feats h3{font:600 20px/1.3 var(--font);letter-spacing:-.01em;margin-bottom:8px}
.feats p{color:var(--mut);font-size:16px}

/* faq */
.faq{max-width:760px;margin:40px auto 0}
details{border-top:1px solid var(--line)}
details:last-child{border-bottom:1px solid var(--line)}
summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 0;font-size:18px;font-weight:500;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:26px;font-weight:400;line-height:1;color:var(--mut);transition:transform .25s var(--ease)}
details[open] summary::after{transform:rotate(45deg)}
details p{color:var(--mut);padding:0 40px 24px 0;font-size:16px}

/* nav */
.nav{display:flex;gap:4px;margin:0 8px 0 auto}
.nav a{padding:8px 14px;border-radius:999px;font-size:15px;font-weight:500;color:var(--mut);transition:color .25s}
.nav a:hover,.nav a.on{color:#fff}
@media(max-width:640px){.nav{display:none}}

/* illustrated features */
section{scroll-margin-top:12px}
.sub{color:var(--mut);text-align:center;max-width:46ch;margin:16px auto 0;font-size:17px;text-wrap:balance}
.fx{display:grid;grid-template-columns:repeat(3,1fr);gap:64px 40px;margin-top:64px}
.fc .art{height:150px;margin-bottom:40px;display:flex;align-items:center;justify-content:center;position:relative}
.fc h3{font:600 20px/1.3 var(--font);letter-spacing:-.01em;margin-bottom:8px}
.fc p{color:var(--mut);font-size:15px;line-height:1.55;max-width:30ch}
@media(max-width:980px){.fx{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.fx{grid-template-columns:1fr;gap:48px}.fc{text-align:left}}
.a-files{position:relative;width:170px;height:110px}
.file{position:absolute;width:74px;height:94px;background:#2a2a2d;border-radius:10px;padding:14px 0 0 14px;color:#a0a0a5;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%)}
.file svg{width:20px;height:20px;display:block}
.file b{position:absolute;left:14px;bottom:14px;font:600 12px/1 var(--font);color:#fff}
.file.f1{left:0;top:0;animation:flt 5s ease-in-out infinite}
.file.f2{left:84px;top:16px;background:#222225;animation:flt 5s ease-in-out -2.5s infinite}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.a-lyr{display:flex;flex-direction:column;gap:6px;width:max-content;font:600 24px/1.2 var(--font);letter-spacing:-.02em;-webkit-mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent)}
.a-lyr .dim{color:#8d8d94;opacity:.6}
.a-lyr .cur{background:linear-gradient(90deg,#fff 50%,rgba(255,255,255,.35) 50%);background-size:200% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;animation:kar 4.5s linear infinite}
@keyframes kar{0%{background-position:100% 0}80%,100%{background-position:0 0}}
.a-sty{display:flex;align-items:center;gap:10px}
.pc{width:62px;height:104px;border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;gap:6px;animation:flt 5.5s ease-in-out infinite}
.pc svg{width:30px;height:30px;margin:2px auto 14px;display:block}
.pc i{display:block;height:4px;width:100%;border-radius:2px;background:currentColor;opacity:.55}
.pc i.s{width:60%;opacity:.3}
.pc.p1{color:#8d8d94}
.pc.p2{width:66px;height:112px;background:#f4f4f5;color:#38383c;animation-delay:-1.8s}
.pc.p3{background:#26262a;color:#a0a0a5;animation-delay:-3.6s}
.a-snd{display:flex;align-items:center;gap:34px}
.a-snd .hp{width:54px;height:54px;color:#9a9a9f}
.sl{display:flex;flex-direction:column;gap:6px}
.sl span{font-size:11px;line-height:1;color:#a0a0a5}
.sl em{display:block;position:relative;width:84px;height:2px;margin-bottom:6px;background:#3a3a3e;border-radius:2px}
.sl u{position:absolute;top:50%;left:20%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#c4c4c9;animation:kn var(--t) ease-in-out var(--d) infinite alternate}
@keyframes kn{from{left:18%}to{left:78%}}
.a-off{display:flex;flex-direction:column;gap:14px;width:210px;-webkit-mask-image:linear-gradient(#000 52%,transparent);mask-image:linear-gradient(#000 52%,transparent)}
.a-off .r{display:flex;align-items:center;gap:16px}
.a-off .ic{flex:none;width:28px;height:28px;border-radius:8px;background:#26262a;color:#8d8d94;display:grid;place-items:center}
.a-off .ic svg{width:15px;height:15px}
.a-off i{flex:1;height:3px;border-radius:2px;background:#3a3a3e}
.a-off .r>svg{flex:none;width:16px;height:16px;color:#a0a0a5;animation:ck 4s ease-in-out infinite;animation-delay:calc(var(--i)*.6s)}
@keyframes ck{0%,12%{opacity:.12;transform:scale(.7)}28%,82%{opacity:1;transform:scale(1)}100%{opacity:.12;transform:scale(.7)}}
.a-imp{position:relative;width:240px;height:130px}
.a-imp .si{position:absolute;left:0;width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:#141417;border:1px solid rgba(255,255,255,.08);color:#8d8d94;transition:color .3s var(--ease),border-color .3s var(--ease),background .3s var(--ease),transform .35s var(--ease),box-shadow .3s}
.a-imp .si svg{display:block;width:19px;height:19px}
.a-imp .si:hover{color:var(--c);border-color:color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 12%,#141417);transform:translateX(4px) scale(1.06);box-shadow:0 0 22px color-mix(in srgb,var(--c) 28%,transparent)}
.a-imp .ln{position:absolute;left:0;top:0;width:240px;height:130px;fill:none;stroke-width:1.3;stroke-linecap:round;pointer-events:none}
.a-imp .ln .b{stroke:#2b2b31}
.a-imp .ln .f{stroke:#d8d8dc;stroke-dasharray:9 100;animation:flow 3.2s linear infinite;transition:stroke .3s}
.a-imp .ln .f.p1{animation-delay:-1s}.a-imp .ln .f.p2{animation-delay:-2s}
.a-imp:has(.s0:hover) .f.p0{stroke:var(--c0)}.a-imp:has(.s1:hover) .f.p1{stroke:var(--c1)}.a-imp:has(.s2:hover) .f.p2{stroke:var(--c2)}
@keyframes flow{from{stroke-dashoffset:9}to{stroke-dashoffset:-100}}
.a-imp .tgt{position:absolute;right:0;top:42px;width:46px;height:46px;padding:10px;border-radius:15px;background:#111114;border:1px solid rgba(255,255,255,.14);box-shadow:0 0 28px rgba(255,255,255,.07);object-fit:contain;animation:glow 3.2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 18px rgba(255,255,255,.05)}50%{box-shadow:0 0 34px rgba(255,255,255,.16)}}
footer{background:#0a0a0a}
footer .cp{display:flex;align-items:center;gap:12px}
.flogo{width:22px;height:22px;border-radius:50%;object-fit:cover}

/* cta + footer */
.cta{text-align:center;padding-bottom:100px}
footer{border-top:1px solid var(--line);padding:32px 0 calc(32px + env(safe-area-inset-bottom));color:var(--mut);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;justify-content:space-between}
footer nav{display:flex;flex-wrap:wrap;gap:8px 24px}
footer a,footer button{background:none;border:0;padding:0;color:var(--mut);font-size:14px}
footer a:hover,footer button:hover{color:#fff}

/* dialog */
dialog{margin:auto;width:min(560px,100% - 32px);padding:32px;background:#0a0a0a;color:var(--ink);border:1px solid var(--line);border-radius:26px}
dialog::backdrop{background:rgba(0,0,0,.72)}
dialog h3{font:600 24px/1.2 var(--font);letter-spacing:-.02em;margin-bottom:14px}
dialog p{color:var(--mut);font-size:16px}
dialog .btn{margin-top:26px;height:46px}

/* language switch fade */
main,footer{transition:opacity .28s cubic-bezier(.4,0,.2,1),transform .28s cubic-bezier(.4,0,.2,1)}
body.sw main,body.sw footer{opacity:0;transform:translateY(6px)}

@media(max-width:720px){
  .feats{grid-template-columns:1fr}
  section{padding:56px 0}
  .hero{padding-bottom:64px}
  .btn{width:100%}
  .row{flex-direction:column;align-items:stretch}
  summary{font-size:17px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

/* adaptive */
@supports(overflow:clip){html,body{overflow-x:clip}}
body{min-width:320px}
img,svg{max-width:100%}
.stage{touch-action:pan-y}
@media(min-width:1500px){.wrap{width:min(1180px,calc(100% - 80px))}.stage{height:min(640px,60vw)}.fx{gap:72px 56px}}
@media(max-width:1024px){section{padding:64px 0}.stage{height:min(540px,68vw)}}
@media(max-width:720px){
  .stage{height:min(340px,84vw)}
  .stage .slide{width:94%}
  .stage .slide.prev,.stage .slide.next{pointer-events:none}
  .lead{max-width:34ch}
  .brand{font-size:22px}
  .cap{font-size:14px;padding:0 4px}
  h2{font-size:clamp(26px,7.4vw,34px)}
  .sub{font-size:16px}
  .fx{margin-top:44px}
  .fc .art{height:140px;margin-bottom:28px}
  footer .wrap{flex-direction:column;align-items:flex-start;gap:16px}
}
@media(max-width:380px){
  h1{font-size:clamp(32px,10.4vw,40px)}
  .btn{padding:0 20px}
  .a-imp{transform:scale(.92);transform-origin:left center}
}
@media(max-height:520px) and (orientation:landscape){
  section{padding:40px 0}.hero{padding:12px 0 40px}.orbit{margin:8px auto 24px}
}
@media(hover:none){.btn:hover{border-color:rgba(255,255,255,.22)}.btn.main:hover{background:#fff;border-color:#fff}}
.orbit .core{width:148px;height:148px;margin:-74px 0 0 -74px}
.core .sw1,.core .sw2{transform-box:fill-box;transform-origin:50% 10%;animation:swing 3.2s ease-in-out infinite}
.core .sw2{animation-delay:-1.6s}
@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.core .hpm{transform-box:fill-box;transform-origin:50% 50%;animation:hpm 4.2s ease-in-out infinite}
@keyframes hpm{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.orbit .core{width:calc(var(--r)*1.16);height:calc(var(--r)*1.16);margin:calc(var(--r)*-.58) 0 0 calc(var(--r)*-.58)}
.core .wv{vector-effect:non-scaling-stroke;stroke-width:1.6px;transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:wv 3.6s ease-out infinite}
@keyframes wv{0%{transform:scale(.3);opacity:.75}100%{transform:scale(1.9);opacity:0}}
.core .nt{transform-box:fill-box;transform-origin:50% 100%;animation:nt 4.4s ease-in-out infinite}
@keyframes nt{0%,100%{transform:translateY(0) rotate(-6deg);opacity:.35}50%{transform:translateY(-26px) rotate(6deg);opacity:.95}}
@media(prefers-reduced-motion:reduce){.core .wv{opacity:.25;transform:scale(1)}}
.core .vn{transform-box:fill-box;transform-origin:50% 50%;animation:vspin 5s linear infinite}
@keyframes vspin{to{transform:rotate(360deg)}}
.core .bt{vector-effect:non-scaling-stroke;stroke-width:1.4px;opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:bt 1.25s ease-out infinite}
@keyframes bt{0%{transform:scale(.96);opacity:.55}100%{transform:scale(1.28);opacity:0}}
.core .vd{transform-box:fill-box;transform-origin:50% 50%;animation:vbeat 1.25s ease-in-out infinite}
@keyframes vbeat{0%,100%{transform:scale(1)}8%{transform:scale(1.04)}30%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.core .vn,.core .vd,.core .bt{animation:none}}
</style>
</head>

function setLogos(){const s=document.querySelector(".brand img").src;document.querySelectorAll("[data-logo]").forEach(i=>i.src=s)}
function spy(){
  const a=document.querySelectorAll("#nav a");let cur=null;
  a.forEach(x=>{const e=document.querySelector(x.getAttribute("href"));if(e&&e.getBoundingClientRect().top<=innerHeight*.4)cur=x});
  a.forEach(x=>x.classList.toggle("on",x===cur));
}

  document.documentElement.lang=L;
  document.title="Lirix — "+t("h1");
  document.querySelector('meta[name=description]').content=t("lead");
  $("#nav").innerHTML=`<a href="#app-preview">${t("n2")}</a><a href="#features">${t("n1")}</a>`;
  $("#lg").innerHTML=flag(L);$("#lg").setAttribute("aria-label",LANGS.find(x=>x[0]==L)[1]);

<section class="hero">

  <h1>${t("h1")}</h1>

    <div class="stage" id="stage">

      const n=SHOTS.length;
      let cls="slide";

function setLang(l){
  if(l===L||!I[l])return;
  lg.classList.add("switching");
  document.body.classList.add("sw");
  setTimeout(()=>{L=l;try{localStorage.setItem("lx-lang",L)}catch(e){}render();document.body.classList.remove("sw");lg.classList.remove("switching")},300);
}
function setTab(i,user){
  if(i===TAB)return;
  const nowT=performance.now();
  if(user&&nowT-lastSwitch<420)return;
  lastSwitch=nowT;
  const old=TAB,n=SHOTS.length;
  TAB=(i+n)%n;
  const dir=((TAB-old+n)%n)>n/2?-1:1;
  const st=$("#stage");if(st)st.style.setProperty("--gx",(dir*8)+"%");
  document.querySelectorAll(".stage .slide:not(.ghost)").forEach((el)=>{
    const k=+el.dataset.i;
    el.classList.remove("on","prev","next","fresh");
    if(k===TAB){el.classList.add("on");void el.offsetWidth;el.classList.add("fresh")}
    else if(k===(TAB-1+n)%n)el.classList.add("prev");
    else if(k===(TAB+1)%n)el.classList.add("next");
  });
  document.querySelectorAll(".dots .dot").forEach((d,k)=>d.classList.toggle("on",k===TAB));
  const cap=$("#cap");if(cap){const tb=t("tabs");cap.textContent=tb[TAB]?tb[TAB][1]:""}
  restartAuto();
}
let autoTimer=null,lastSwitch=0,swiped=0;
function restartAuto(){
  clearTimeout(autoTimer);
  autoTimer=setTimeout(()=>setTab(TAB+1,false),4500);
}
function startAuto(){restartAuto()}

const lg=$("#lg");
lg.addEventListener("contextmenu",e=>e.preventDefault());
lg.addEventListener("mousedown",e=>{if(e.button===2)e.preventDefault()});
document.addEventListener("click",e=>{
  const c=e.target.closest.bind(e.target);
  if(c("#lg")){
    const idx=LANGS.findIndex(x=>x[0]===L);
    setLang(LANGS[(idx+1)%LANGS.length][0]);
    return;
  }
  const sl=c(".stage .slide");if(sl&&performance.now()-swiped>500&&!sl.classList.contains("ghost")){setTab(TAB+(sl.classList.contains("prev")?-1:1),true);return}
  const tb=c("[data-tab]");if(tb){setTab(+tb.dataset.tab,true);return}
  const d=c("[data-dlg]");if(d){const k=d.dataset.dlg,dlg=$("#dlg");dlg.innerHTML=`<h3>${t(k+"L")}</h3><p>${t(k+"B")}</p><button type="button" class="btn" data-close>${t("close")}</button>`;dlg.showModal();return}
  if(c("[data-close]")||e.target===$("#dlg"))$("#dlg").close();
});
document.addEventListener("contextmenu",e=>{
  if(e.target.closest("#lg")){
    e.preventDefault();
    const idx=LANGS.findIndex(x=>x[0]===L);
    setLang(LANGS[(idx-1+LANGS.length)%LANGS.length][0]);
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight")setTab(TAB+1,true);
  if(e.key==="ArrowLeft")setTab(TAB-1,true);
});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden)clearTimeout(autoTimer);else restartAuto();
});
addEventListener("scroll",spy,{passive:true});
let tx=0,ty=0;
document.addEventListener("touchstart",e=>{if(e.target.closest&&e.target.closest("#stage")){tx=e.touches[0].clientX;ty=e.touches[0].clientY}},{passive:true});
document.addEventListener("touchend",e=>{if(!(e.target.closest&&e.target.closest("#stage")))return;const q=e.changedTouches[0],dx=q.clientX-tx,dy=q.clientY-ty;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.5){swiped=performance.now();setTab(TAB+(dx<0?1:-1),true)}},{passive:true});
render();
startAuto();
</script>
